<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="t d">
<title id="t">Reported results</title><desc id="d">Training accuracy about 90 percent, validation accuracy about 85 percent, test accuracy not yet reported.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
.fl{animation:float 8s ease-in-out infinite}
.pl{stroke-dasharray:3 13;animation:flow 1.8s linear infinite}
.nd{animation:glow 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fl,.pl,.nd{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#0e1124"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="acv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a2140" stroke-width="1" opacity=".55"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#070a14" opacity=".55"/></pattern>
</defs>
<rect width="1200" height="214" rx="16" fill="url(#bg)"/><rect width="1200" height="214" rx="16" fill="url(#grid)"/>
<rect x="53" y="24" width="346" height="126" rx="12" fill="#0a0f20" stroke="#2b3668"/>
<text class="mono" x="77" y="54" font-size="11" fill="#7080a6" letter-spacing="2.5">TRAINING ACCURACY</text>
<text class="sans" x="75" y="108" font-size="52" font-weight="700" fill="#e8ecff" letter-spacing="-1">~90%</text>
<rect x="77" y="124" width="298" height="6" rx="3" fill="#161d3a"/>
<rect x="77" y="124" width="268.2" height="6" rx="3" fill="#22d3ee"/>
<text class="mono" x="375" y="108" font-size="11" fill="#5b6b90" text-anchor="end">reported</text>
<rect x="427" y="24" width="346" height="126" rx="12" fill="#0a0f20" stroke="#2b3668"/>
<text class="mono" x="451" y="54" font-size="11" fill="#7080a6" letter-spacing="2.5">VALIDATION ACCURACY</text>
<text class="sans" x="449" y="108" font-size="52" font-weight="700" fill="#e8ecff" letter-spacing="-1">~85%</text>
<rect x="451" y="124" width="298" height="6" rx="3" fill="#161d3a"/>
<rect x="451" y="124" width="253.3" height="6" rx="3" fill="#8b5cf6"/>
<text class="mono" x="749" y="108" font-size="11" fill="#5b6b90" text-anchor="end">reported</text>
<rect x="801" y="24" width="346" height="126" rx="12" fill="#0a0f20" stroke="#3a4472" stroke-dasharray="5 5"/>
<text class="mono" x="825" y="54" font-size="11" fill="#7080a6" letter-spacing="2.5">TEST ACCURACY</text>
<text class="sans" x="823" y="108" font-size="52" font-weight="700" fill="#5b6b90" letter-spacing="-1">—</text>
<text class="mono" x="1123" y="108" font-size="11" fill="#5b6b90" text-anchor="end">not yet reported</text>
<text class="mono" x="825" y="132" font-size="11" fill="#5b6b90">evaluation cell is in the notebook</text>
<text class="mono" x="600" y="184" font-size="12" fill="#7080a6" text-anchor="middle">500 epochs  ·  learning rate 0.1  ·  full-batch gradient descent  ·  accuracy printed every 50 epochs</text>
<rect x="0" y="211" width="1200" height="3" fill="url(#ac)" opacity=".9"/><rect x=".5" y=".5" width="1199" height="213" rx="16" fill="none" stroke="#1c2548"/>
</svg>
